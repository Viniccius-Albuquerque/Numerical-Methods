[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metodos-numericos"
version = "1.0.0"
description = "Implementação de métodos numéricos para resolução de equações não lineares"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]